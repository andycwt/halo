apiVersion: storage.halo.run/v1alpha1
kind: PolicyTemplate
metadata:
  name: local
spec:
  displayName: 本地儲存
  settingName: local-policy-template-setting
---
apiVersion: storage.halo.run/v1alpha1
kind: Policy
metadata:
  name: default-policy
  labels:
    halo.run/do-not-overwrite: "true"
  finalizers:
    - system-protection
spec:
  displayName: 本地儲存
  templateName: local
  configMapName: default-policy-config
---
apiVersion: v1alpha1
kind: ConfigMap
metadata:
  name: default-policy-config
  labels:
    storage.halo.run/policy-owner: default-policy
    halo.run/do-not-overwrite: "true"
data:
  default: '{"location":"","maxFileSize":"200MB","allowedFileTypes":["IMAGE","VIDEO","AUDIO"]}'
---
apiVersion: v1alpha1
kind: Setting
metadata:
  name: local-policy-template-setting
spec:
  forms:
    - group: default
      label: 預設
      formSchema:
        - $formkit: text
          name: location
          label: 儲存位置
          help: ~/.halo2/attachments/upload 下的子目錄
        - $formkit: text
          name: maxFileSize
          label: 單一檔案大小上限
          validation: [ [ 'matches', '/^(0|[1-9]\d*)(?:[KMG]B)?$/' ] ]
          validation-visibility: "live"
          validation-messages:
            matches: "輸入格式錯誤，請遵循：整數 + 大寫單位（KB, MB, GB）"
          help: "0 表示不限制，範例：5KB、10MB、1GB"
        - $formkit: checkbox
          name: allowedFileTypes
          label: 檔案類型限制
          help: 限制允許上傳的檔案類型
          options:
            - label: 無限制
              value: ALL
            - label: 圖片
              value: IMAGE
            - label: SVG
              value: SVG
            - label: 影片
              value: VIDEO
            - label: 音訊
              value: AUDIO
            - label: 文件
              value: DOCUMENT
            - label: 壓縮檔
              value: ARCHIVE
        - $formkit: checkbox
          name: alwaysRenameFilename
          id: alwaysRenameFilename
          label: 是否總是重命名檔案
          help: 勾選後上傳的檔案名稱將被重命名
          value: false
        - $formkit: group
          if: $get(alwaysRenameFilename).value
          id: renameStrategy
          name: renameStrategy
          label: 重命名策略
          value:
            method: RANDOM
            randomLength: 32
          children:
            - $formkit: radio
              name: method
              label: 重命名方法
              options:
                - label: 隨機字串
                  value: RANDOM
                - label: UUID
                  value: UUID
                - label: 時間戳記（毫秒級）
                  value: TIMESTAMP
            - $formkit: number
              number: integer
              if: "$value.method === RANDOM"
              name: randomLength
              id: randomLength
              label: 隨機檔案名稱長度
              help: 預設值為 32。受限於檔案名稱長度限制，範圍為 [8, 64]。
              validation: "between:8,64"
              validation-visibility: live
              min: 8
              max: 64
            - $formkit: checkbox
              name: excludeOriginalFilename
              label: 是否排除原始檔案名稱
              help: 勾選後重命名後的檔案名稱將不包含原始名稱
---
apiVersion: storage.halo.run/v1alpha1
kind: Group
metadata:
  name: user-avatar-group
  labels:
    halo.run/hidden: "true"
  finalizers:
    - system-protection
spec:
  displayName: 使用者大頭照組
