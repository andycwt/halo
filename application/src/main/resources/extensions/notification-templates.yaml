# ─────────────────────────────────────────────
# new-device-login
# ─────────────────────────────────────────────
---
apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-new-device-login
spec:
  reasonSelector:
    reasonType: new-device-login
    language: default
  template:
    title: "Your [(${site.title})] account was used to sign in on [(${os})]"
    rawBody: |
      Hello [(${subscriber.displayName})],

        Your [(${site.title})] account was used to sign in on [(${browser})] on [(${os})].
        Time: [(${loginTime})]
        IP address: [(${ipAddress})]
        If you are aware of this sign-in, please ignore this message.
        If you did not recently sign in to your Halo account and believe someone may have accessed your account, please reset your password immediately.
    htmlBody: |
      <div class="notification-content">
        <div class="head">
          <p class="honorific" th:text="|Hello ${subscriber.displayName},|"></p>
        </div>
        <div class="body">
          <p th:text="|Your ${site.title} account was used to sign in on ${browser} on ${os}:|"></p>
          <div class="device-info">
            <p th:text="|Time: ${loginTime}|"></p>
            <p th:text="|IP address: ${ipAddress}|"></p>
          </div>
          <p>If you are aware of this sign-in, please ignore this message.</p>
          <p th:text="|If you did not recently sign in to your ${site.title} account and believe someone may have accessed your account, please reset your password immediately.|"></p>
        </div>
      </div>

