# ─────────────────────────────────────────────
# someone-replied-to-you
# ─────────────────────────────────────────────
---
apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-someone-replied-to-you
spec:
  reasonSelector:
    reasonType: someone-replied-to-you
    language: default
  template:
    title: "[(${replier})] replied to your comment"
    rawBody: |
      Hello [(${subscriber.displayName})],

        [(${replier})] replied to your comment "[(${isQuoteReply ? quoteContent : commentContent})]". Here is the reply:

        [(${content})]

        [(${replyUrl != null ? '查看回复：' + replyUrl : ''})]
    htmlBody: |
      <div class="notification-content">
        <div class="head">
          <p class="honorific" th:text="|Hello ${subscriber.displayName},|"></p>
        </div>
        <div class="body">
          <p>
            <span th:text="${replier}"></span> replied to your comment on
            <a th:href="${commentSubjectUrl}" target="_blank" th:text="|《${commentSubjectTitle}》|"></a>.
          </p>
          <p>Your comment:</p>
          <div class="content" th:utext="${isQuoteReply ? quoteContent : commentContent}"></div>
          <p>Reply:</p>
          <div class="content" th:utext="${content}"></div>
        </div>
        <div></div>
      </div>

