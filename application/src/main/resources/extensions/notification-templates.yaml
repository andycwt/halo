# ─────────────────────────────────────────────
# email-verification
# ─────────────────────────────────────────────
---
apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-email-verification
spec:
  reasonSelector:
    reasonType: email-verification
    language: default
  template:
    title: "Email Verification - [(${site.title})]"
    rawBody: |
      [[(${site.title})]] Your email verification code is: [(${code})]. Please complete verification within [(${expirationAtMinutes})] minutes.
    htmlBody: |
      <div class="notification-content">
        <div class="head">
          <p class="honorific" th:text="|Hello ${username},|"></p>
        </div>
        <div class="body">
          <p>Please use the one-time password (OTP) below to verify your email address.</p>
          <div class="verify-code" style="font-size:24px;line-height:24px;color:#333;">
            <b th:text="${code}"></b>
          </div>
          <p th:text="|This code is valid for ${expirationAtMinutes} minutes.|"></p>
          <p>If you did not attempt to verify your email address, please ignore this message.</p>
        </div>
      </div>

---
apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-email-verification-zh
spec:
  reasonSelector:
    reasonType: email-verification
    language: zh
  template:
    title: "邮箱验证 - [(${site.title})]"
    rawBody: |
      【[(${site.title})]】您的邮箱验证码是：[(${code})]，请在 [(${expirationAtMinutes})] 分钟内完成验证。
    htmlBody: |
      <div class="notification-content">
        <div class="head">
          <p class="honorific" th:text="|${username} 您好：|"></p>
        </div>
        <div class="body">
          <p>请使用下方的动态验证码（OTP）验证您的电子邮箱地址。</p>
          <div class="verify-code" style="font-size:24px;line-height:24px;color:#333;">
            <b th:text="${code}"></b>
          </div>
          <p th:text="|动态验证码的有效期为 ${expirationAtMinutes} 分钟。|"></p>
          <p>如果您没有尝试验证您的电子邮箱地址，请忽略此邮件。</p>
        </div>
      </div>

---
