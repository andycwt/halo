apiVersion: notification.halo.run/v1alpha1
kind: NotifierDescriptor
metadata:
  name: default-email-notifier
spec:
  displayName: '郵件通知'
  description: '透過郵件將通知發送給使用者'
  notifierExtName: 'halo-email-notifier'
  senderSettingRef:
    name: "notifier-setting-for-email"
    group: "sender"
---
apiVersion: v1alpha1
kind: Setting
metadata:
  name: notifier-setting-for-email
spec:
  forms:
    - group: sender
      label: 發信設定
      formSchema:
        - $formkit: checkbox
          label: "啟用郵件通知器"
          value: false
          name: enable
        - $formkit: verificationForm
          if: "$enable"
          action: /apis/console.api.notification.halo.run/v1alpha1/notifiers/default-email-notifier/verify-connection
          label: 測試信箱
          children:
            - $formkit: text
              label: "使用者名稱"
              name: username
              validation: required
            - $formkit: text
              if: "$enable"
              label: "發信地址"
              name: "sender"
              help: "如果使用者名稱為實際發信地址，可忽略"
            - $formkit: password
              label: "密碼"
              name: password
              validation: required
            - $formkit: text
              label: "顯示名稱"
              name: displayName
            - $formkit: text
              label: "SMTP 伺服器位址"
              name: host
              validation: required
            - $formkit: text
              label: "連接埠"
              name: port
              validation: required
            - $formkit: select
              label: "加密方式"
              name: encryption
              value: "SSL"
              options:
                - label: "SSL"
                  value: "SSL"
                - label: "TLS"
                  value: "TLS"
                - label: "不加密"
                  value: "NONE"
---
apiVersion: notification.halo.run/v1alpha1
kind: ReasonType
metadata:
  name: new-comment-on-post
  annotations:
    rbac.authorization.halo.run/ui-permissions: |
      [ "uc:posts:publish" ]
spec:
  displayName: "我的文章收到新評論"
  description: "如果有讀者在你的文章下方留下了新的評論，你將會收到一條通知。這個通知事件可以幫助你及時了解讀者對文章的意見，以便更好地與讀者互動，提高文章品質與受歡迎程度。"
  properties:
    - name: postName
      type: string
      description: "The name of the post."
    - name: postOwner
      type: string
      description: "The user name of the post owner."
    - name: postTitle
      type: string
    - name: postUrl
      type: string
    - name: commentUrl
      type: string
      optional: true
      description: "The frontend permalink of the new comment."
    - name: commenter
      type: string
      description: "The display name of the commenter."
    - name: commentName
      type: string
      description: "The name of the comment."
    - name: content
      type: string
      description: "The content of the comment."
---
apiVersion: notification.halo.run/v1alpha1
kind: ReasonType
metadata:
  name: new-comment-on-single-page
  annotations:
    rbac.authorization.halo.run/ui-permissions: |
      [ "system:singlepages:manage" ]
spec:
  displayName: "我的自定義頁面收到新評論"
  description: "當你建立的自定義頁面收到新評論時，你將會收到一條通知。"
  properties:
    - name: pageName
      type: string
      description: "The name of the single page."
    - name: pageOwner
      type: string
      description: "The user name of the page owner."
    - name: pageTitle
      type: string
    - name: pageUrl
      type: string
    - name: commentUrl
      type: string
      optional: true
      description: "The frontend permalink of the new comment."
    - name: commenter
      type: string
      description: "The display name of the commenter."
    - name: commentName
      type: string
      description: "The name of the comment."
    - name: content
      type: string
      description: "The content of the comment."
---
apiVersion: notification.halo.run/v1alpha1
kind: ReasonType
metadata:
  name: someone-replied-to-you
spec:
  displayName: "有人回覆了我"
  description: "如果有其他使用者回覆了你的評論，你將會收到一條通知。"
  properties:
    - name: commentName
      type: string
      description: "The name of the comment."
    - name: commentSubjectTitle
      type: string
    - name: commentSubjectUrl
      type: string
    - name: replyUrl
      type: string
      optional: true
      description: "The frontend permalink of the new reply."
    - name: quoteContent
      type: string
      optional: true
      description: "The content of quoted reply."
    - name: isQuoteReply
      type: boolean
    - name: commentContent
      type: string
    - name: repliedOwner
      type: string
      description: "The owner of the comment or reply that has been replied to."
    - name: replyOwner
      type: string
      description: "The user who created the current reply."
    - name: replier
      type: string
      description: "The display name of the replier."
    - name: replyName
      type: string
      description: "The name of the reply."
    - name: content
      type: string
      description: "The content of the reply."
---
apiVersion: notification.halo.run/v1alpha1
kind: ReasonType
metadata:
  name: email-verification
  labels:
    halo.run/hidden: "true"
spec:
  displayName: "信箱驗證"
  description: "當你的信箱被用於註冊帳戶時，會收到一條帶有驗證碼的郵件，你需要點擊郵件中的連結來驗證信箱是否屬於你。"
  properties:
    - name: username
      type: string
      description: "The username of the user."
    - name: code
      type: string
      description: "The verification code."
    - name: expirationAtMinutes
      type: string
      description: "The expiration minutes of the verification code, such as 5 minutes."
---
apiVersion: notification.halo.run/v1alpha1
kind: ReasonType
metadata:
  name: reset-password-by-email
  labels:
    halo.run/hidden: "true"
spec:
  displayName: "透過郵件地址重設密碼"
  description: "當你透過郵件地址找回密碼時，會收到一條帶有密碼重設連結的郵件，你需要點擊郵件中的連結來重設密碼。"
  properties:
    - name: username
      type: string
      description: "The username of the user."
    - name: link
      type: string
      description: "The reset link."
    - name: expirationAtMinutes
      type: string
      description: "The expiration minutes of the reset link, such as 30 minutes."
---
