apiVersion: v1alpha1
kind: "Role"
metadata:
  name: post-editor
  labels:
    rbac.authorization.halo.run/system-reserved: "true"
  annotations:
    # 目前 yaml 定義不支援 i18n，請參閱 https://github.com/halo-dev/halo/issues/3573
    rbac.authorization.halo.run/display-name: "文章管理員"
    rbac.authorization.halo.run/dependencies: |
      ["role-template-manage-posts"]
rules: []

---
apiVersion: v1alpha1
kind: "Role"
metadata:
  name: post-author
  labels:
    rbac.authorization.halo.run/system-reserved: "true"
  annotations:
    # 目前 yaml 定義不支援 i18n，請參閱 https://github.com/halo-dev/halo/issues/3573
    rbac.authorization.halo.run/display-name: "作者"
    rbac.authorization.halo.run/disallow-access-console: "true"
    rbac.authorization.halo.run/redirect-on-login: "/uc"
    rbac.authorization.halo.run/dependencies: |
      [ "role-template-post-author" ]
rules: []

---
apiVersion: v1alpha1
kind: "Role"
metadata:
  name: role-template-post-author
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "文章管理"
    # 目前 yaml 定義不支援 i18n，請參閱 https://github.com/halo-dev/halo/issues/3573
    rbac.authorization.halo.run/display-name: "文章作者模板"
    rbac.authorization.halo.run/dependencies: |
      [ "role-template-post-contributor", "role-template-post-publisher", "role-template-recycle-my-post",
        "role-template-uc-attachment-manager" ]
rules: []

---
apiVersion: v1alpha1
kind: "Role"
metadata:
  name: post-contributor
  labels:
    rbac.authorization.halo.run/system-reserved: "true"
  annotations:
    # 目前 yaml 定義不支援 i18n，請參閱 https://github.com/halo-dev/halo/issues/3573
    rbac.authorization.halo.run/display-name: "投稿者"
    rbac.authorization.halo.run/disallow-access-console: "true"
    rbac.authorization.halo.run/redirect-on-login: "/uc"
    rbac.authorization.halo.run/dependencies: |
      [ "role-template-post-contributor" ]
rules: []

---
apiVersion: v1alpha1
kind: "Role"
metadata:
  name: role-template-post-contributor
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "文章管理"
    # 目前 yaml 定義不支援 i18n，請參閱 https://github.com/halo-dev/halo/issues/3573
    rbac.authorization.halo.run/display-name: "文章投稿者模板"
    rbac.authorization.halo.run/dependencies: |
      [ "role-template-view-categories", "role-template-view-tags" ]
    rbac.authorization.halo.run/ui-permissions: |
      [ "uc:posts:manage" ]
rules:
  - apiGroups: ["uc.api.content.halo.run"]
    resources: ["posts"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: ["uc.api.content.halo.run"]
    resources: ["posts/draft"]
    verbs: ["update", "get"]

---
apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-post-publisher
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "文章管理"
    rbac.authorization.halo.run/display-name: "文章發佈者模板"
    rbac.authorization.halo.run/ui-permissions: |
      [ "uc:posts:publish" ]
rules:
  - apiGroups: ["uc.api.content.halo.run"]
    resources: ["posts/publish", "posts/unpublish"]
    verbs: ["update"]

---
# TODO remove this in next major version
apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-recycle-my-post
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "文章管理"
    rbac.authorization.halo.run/display-name: "回收我的文章模板"
    rbac.authorization.halo.run/ui-permissions: |
      [ "uc:posts:recycle" ]
rules:
  - apiGroups: ["uc.api.content.halo.run"]
    resources: ["posts/recycle"]
    verbs: ["delete"]

