apiVersion: v1alpha1
kind: Setting
metadata:
  name: system
spec:
  forms:
    - group: basic
      label: 基本設定
      formSchema:
        - $formkit: text
          label: "網站標題"
          name: title
          validation: required
        - $formkit: text
          label: "網站副標題"
          name: subtitle
        - $formkit: attachment
          label: Logo
          name: logo
          width: "4rem"
          accepts:
            - "image/*"
        - $formkit: attachment
          label: Favicon
          name: favicon
          width: "4rem"
          accepts:
            - "image/*"
        - $formkit: select
          label: "偏好語言"
          name: language
          value: "zh-CN"
          options:
            - label: 'English'
              value: 'en'
            - label: 'Español'
              value: 'es'
            - label: '簡體中文'
              value: 'zh-CN'
            - label: '繁體中文'
              value: 'zh-TW'
    - group: post
      label: 文章設定
      formSchema:
        - $formkit: number
          label: "文章列表顯示數量"
          name: postPageSize
          value: 10
          min: 1
          max: 100
          validation: required | max:100
        - $formkit: number
          label: "歸檔頁文章顯示數量"
          name: archivePageSize
          value: 10
          min: 1
          max: 100
          validation: required | max:100
        - $formkit: number
          label: "分類頁文章顯示數量"
          name: categoryPageSize
          value: 10
          min: 1
          max: 100
          validation: required | max:100
        - $formkit: number
          label: "標籤頁文章顯示數量"
          name: tagPageSize
          value: 10
          min: 1
          max: 100
          validation: required
        - $formkit: number
          label: "作者頁文章顯示數量"
          name: authorPageSize
          value: 10
          min: 1
          max: 100
          validation: required
        - $formkit: select
          label: "別名產生策略"
          name: slugGenerationStrategy
          value: "generateByTitle"
          options:
            - label: '根據標題'
              value: 'generateByTitle'
            - label: '時間戳記'
              value: 'timestamp'
            - label: 'Short UUID'
              value: 'shortUUID'
            - label: 'UUID'
              value: 'UUID'
          help: 此選項僅在建立文章時生效，修改此選項不會影響現有文章
        - $formkit: attachmentPolicySelect
          name: attachmentPolicyName
          label: "附件儲存策略"
          value: "default-policy"
          help: 用於指定在文章編輯器中上傳的預設附件儲存策略（已過時，請使用附件配置中的管理介面附件配置）
        - $formkit: attachmentGroupSelect
          name: attachmentGroupName
          label: "附件儲存群組"
          value: ""
          help: 用於指定在文章編輯器中上傳的預設附件儲存分組（已過時，請使用附件配置中的管理介面附件配置）
    - group: seo
      label: SEO 設定
      formSchema:
        - $formkit: checkbox
          name: blockSpiders
          label: "封鎖搜尋引擎"
          value: false
          help: "為所有頁面添加 <meta name=\"robots\" content=\"noindex\" /> 標籤，阻止搜尋引擎索引，但並非所有搜尋引擎都會遵守"
        - $formkit: textarea
          name: keywords
          label: "網站關鍵字"
          help: "目前主流搜尋引擎已不再使用此欄位，通常不建議設置，此選項可能在未來版本中移除"
          auto-height: true
        - $formkit: textarea
          name: description
          label: "網站描述"
          help: "僅對首頁生效，其他頁面將根據頁面類型自動產生描述"
          auto-height: true
    - group: user
      label: 使用者設定
      formSchema:
        - $formkit: checkbox
          name: allowRegistration
          id: allowRegistration
          key: allowRegistration
          label: "開放註冊"
          value: false
        - $formkit: checkbox
          name: mustVerifyEmailOnRegistration
          label: "註冊需驗證電子信箱"
          help: "開啟後，使用者需驗證電子信箱後才能存取受保護的資源，具有超級管理員權限的請求除外。此設定同樣影響現有使用者和個人令牌（PAT），關閉註冊後仍然生效。請確保已正確配置郵件通知程式"
          value: false
        - $formkit: textarea
          name: protectedUsernames
          label: "保留使用者名稱與名稱"
          if: "$get(allowRegistration).value === true"
          help: 保留使用者名稱與名稱，限制使用者註冊或編輯資料時使用，多個請用半形逗號 , 分隔，留空則不限制
          value: "admin,administrator,root,system,superuser,guest,test,demo,user,backup,ftp,www,manager,support,service,api,超級管理員,管理員"
        - $formkit: roleSelect
          name: defaultRole
          excludedNames:
            - super-role
          label: "預設角色"
          validation: 'required'
          if: "$get(allowRegistration).value === true"
          help: 使用者註冊後預設為其分配的角色
        - $formkit: singlePageSelect
          name: requiredAgreementPages
          label: "註冊時所需協議"
          multiple: true
          if: "$get(allowRegistration).value === true"
          help: 選擇註冊時需要使用者同意的協議頁面
        - $formkit: attachmentPolicySelect
          name: avatarPolicy
          label: "頭像儲存位置"
          value: "default-policy"
          help: 指定使用者上傳頭像的儲存策略（已過時，請使用附件配置中的頭像附件配置）
        - $formkit: attachmentPolicySelect
          name: ucAttachmentPolicy
          label: "個人中心附件儲存位置"
          value: "default-policy"
          help: 指定使用者在個人中心上傳附件的儲存位置（已過時，請使用附件配置中的個人中心附件配置）
    - group: attachment
      label: 附件配置
      formSchema:
        - $formkit: group
          name: console
          label: 管理介面附件配置
          help: 設定從管理介面直接上傳附件時的預設儲存策略與群組
          children:
            - $formkit: attachmentPolicySelect
              name: policyName
              label: "儲存策略"
              auto-select: false
            - $formkit: attachmentGroupSelect
              name: groupName
              label: "儲存群組"
              auto-select: false
              clearable: true
        - $formkit: group
          name: uc
          label: 個人中心附件配置
          help: 設定從個人中心直接上傳附件時的預設儲存策略與群組。基於安全考量，建議為所選儲存策略限制檔案類型與大小
          children:
            - $formkit: attachmentPolicySelect
              name: policyName
              label: "儲存策略"
              auto-select: false
            - $formkit: attachmentGroupSelect
              name: groupName
              label: "儲存群組"
              auto-select: false
              clearable: true
        - $formkit: group
          name: avatar
          label: 頭像附件配置
          help: 設定使用者頭像的儲存策略。基於安全考量，建議為所選儲存策略限制檔案類型與大小
          children:
            - $formkit: attachmentPolicySelect
              name: policyName
              label: "儲存策略"
    - group: comment
      label: 評論設定
      formSchema:
        - $formkit: checkbox
          name: enable
          value: true
          label: "啟用評論"
        - $formkit: checkbox
          name: requireReviewForNew
          value: true
          label: "新評論審核"
          help: 開啟後，新評論需經管理員審核後才會顯示
        - $formkit: checkbox
          name: systemUserOnly
          value: true
          label: "僅允許註冊使用者評論"
    - group: routeRules
      label: 佈景主題路徑設定
      formSchema:
        - $formkit: checkbox
          label: "關閉佈景主題預覽"
          value: false
          name: disableThemePreview
          help: "關閉後，未具備佈景主題管理權限的使用者將無法透過參數預覽未啟用的佈景主題"
        - $formkit: text
          label: "分類頁路徑前綴"
          value: "categories"
          name: categories
          validation: required | alphanumeric
        - $formkit: text
          label: "標籤頁路徑前綴"
          value: "tags"
          name: tags
          validation: required | alphanumeric
        - $formkit: text
          label: "歸檔頁路徑前綴"
          value: "archives"
          name: archives
          validation: required | alphanumeric
        - $formkit: select
          label: 文章詳情頁存取規則
          value: '/archives/{slug}'
          options:
            - label: "/archives/{slug}"
              value: "/archives/{slug}"
            - label: "/archives/{name}"
              value: "/archives/{name}"
            - label: "/?p={name}"
              value: "/?p={name}"
            - label: "/?p={slug}"
              value: "/?p={slug}"
            - label: "/{year}/{slug}"
              value: '/{year:\d{4}}/{slug}'
            - label: "/{year}/{month}/{slug}"
              value: '/{year:\d{4}}/{month:\d{2}}/{slug}'
            - label: "/{year}/{month}/{day}/{slug}"
              value: '/{year:\d{4}}/{month:\d{2}}/{day:\d{2}}/{slug}'
            - label: "/categories/{categorySlug}/{slug}"
              value: "/categories/{categorySlug}/{slug}"
          name: post
          validation: required
    - group: codeInjection
      label: 程式碼注入
      formSchema:
        - $formkit: code
          language: html
          height: 200px
          label: "全域 head 標籤"
          name: globalHead
          help: "將程式碼注入到所有頁面的 <head> 標籤部分"
        - $formkit: code
          language: html
          height: 200px
          label: "內容頁 head 標籤"
          name: contentHead
          help: "將程式碼注入到文章頁面與自訂頁面的 <head> 標籤部分"
        - $formkit: code
          language: html
          height: 200px
          label: "頁尾"
          name: footer
          help: "將程式碼注入到所有頁面的頁尾部分"
