apiVersion: v1alpha1
kind: User
metadata:
  name: anonymousUser
  labels:
    halo.run/hidden-user: "true"
  finalizers:
    - system-protection
spec:
  displayName: 匿名使用者
  email: anonymous@example.com
  disabled: true

---
apiVersion: v1alpha1
kind: User
metadata:
  name: ghost
  labels:
    halo.run/hidden-user: "true"
  finalizers:
    - system-protection
spec:
  displayName: 已刪除使用者
  email: ghost@example.com
  disabled: true
  bio: 該使用者已被刪除。
